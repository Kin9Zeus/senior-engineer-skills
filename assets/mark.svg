<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-labelledby="t d">
  <title id="t">Devleck</title>
  <desc id="d">The Devleck mark: a glitch-style upward arrow in lime.</desc>

  <defs>
    <linearGradient id="lime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#F4FF4A"/>
      <stop offset="100%" stop-color="#D8EC00"/>
    </linearGradient>
  </defs>

  <g transform="translate(30 26)">
    <!-- outer chevron -->
    <path d="M130 8 L248 126 L248 196 L130 78 L12 196 L12 126 Z" fill="url(#lime)"/>
    <!-- inner chevron with the split shaft -->
    <path d="M130 106 L192 168 L192 262 L152 262 L152 168 L130 146 L108 168 L108 262 L68 262 L68 168 Z" fill="url(#lime)"/>

    <!-- glitch fragments -->
    <g fill="#ECFF0C">
      <rect x="-26" y="118" width="32" height="7"/>
      <rect x="-12" y="140" width="18" height="6" opacity=".85"/>
      <rect x="-36" y="160" width="24" height="6" opacity=".7"/>
      <rect x="18"  y="96"  width="44" height="6" opacity=".8"/>
      <rect x="4"   y="182" width="28" height="6" opacity=".65"/>
      <rect x="252" y="112" width="36" height="7"/>
      <rect x="266" y="134" width="20" height="6" opacity=".85"/>
      <rect x="252" y="156" width="28" height="6" opacity=".7"/>
      <rect x="202" y="90"  width="38" height="6" opacity=".8"/>
      <rect x="198" y="212" width="24" height="6" opacity=".6"/>
    </g>
  </g>
</svg>
